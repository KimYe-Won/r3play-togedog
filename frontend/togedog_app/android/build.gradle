allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    def newSubprojectBuildDir = newBuildDir.dir(project.name)
    project.layout.buildDirectory.value(newSubprojectBuildDir)
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}

subprojects {
    if (project.name != "app") {
        afterEvaluate {
            def ext = extensions.findByType(com.android.build.gradle.BaseExtension)
            if (ext != null) {
                def current = ext.compileSdkVersion?.replace("android-", "")?.toInteger() ?: 0
                if (current < 34) {
                    ext.compileSdkVersion(34)
                }
            }
        }
    }
}
